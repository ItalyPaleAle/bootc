name: "Build Containers"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      rebuild-all:
        description: "Rebuild every container image, without analyzing what changed"
        type: boolean
        default: true

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker registry
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME_BASE: ${{ github.repository }}

jobs:
  # Determines which container images need to be rebuilt, comparing the current commit with the one built by the previous successful run
  analyze-changes:

    name: "Analyze changes"

    runs-on: ubuntu-26.04

    permissions:
      contents: read
      # Necessary for looking up the commit built by the previous run
      actions: read

    outputs:
      # JSON array with one object per base image that has containers to rebuild.
      # Each one carries the "workDir" and "baseImage" to build, and "containers" with the JSON-encoded list of containers.
      # The containers are in the order they must be built in.
      matrix: ${{ steps.analyze-changes.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The entire history is needed to diff against the commit built by the previous run
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      # Compile the tools app
      - name: Compile tools app
        run: |
          mkdir -p ../.bin
          go build \
            -v \
            -o ../.bin/tools
        working-directory: ./tools

      # Find the commit built by the previous successful run of this workflow, which is the baseline the current commit is compared with.
      # Using the previous successful run, rather than the previous commit, means changes that were part of a failed run are analyzed again.
      - name: Find the previously-built commit
        id: previous-run
        env:
          GH_TOKEN: ${{ github.token }}
          # Commit that was at the tip of the branch before this push
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          BASE_SHA=$(gh api \
            -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-containers.yaml/runs" \
            -f "branch=${GITHUB_REF_NAME}" \
            -f "status=success" \
            -f "per_page=20" \
            --jq '[.workflow_runs[] | select(.head_sha != env.GITHUB_SHA) | .head_sha] | first // ""')

          # The commit may no longer be in the history of the branch, for example after a force push
          if [ -n "${BASE_SHA}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Commit ${BASE_SHA} is not in the history of this branch, ignoring it"
            BASE_SHA=""
          fi

          # Fall back to the commit that was at the tip of the branch before this push
          if [ -z "${BASE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${BEFORE_SHA}"
          fi

          echo "Comparing ${GITHUB_SHA} with ${BASE_SHA:-(nothing: all containers will be rebuilt)}"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      # Determine which containers need to be rebuilt for each base image
      - name: Analyze changes
        id: analyze-changes
        env:
          BASE_SHA: ${{ steps.previous-run.outputs.base_sha }}
          REBUILD_ALL: ${{ inputs.rebuild-all }}
        run: |
          set -euo pipefail

          mkdir -p .out/previous

          # With no commit to compare with, or when a full rebuild was requested, every container is rebuilt
          REBUILD_ALL_FLAG=()
          : > .out/changed-files.txt
          if [ "${REBUILD_ALL}" = "true" ] || [ -z "${BASE_SHA}" ]; then
            REBUILD_ALL_FLAG=(--rebuild-all)
          else
            # Use NUL as separator, so file names are never quoted or split
            git diff --name-only -z "${BASE_SHA}" "${GITHUB_SHA}" > .out/changed-files.txt
            echo "Changed files:"
            tr '\0' '\n' < .out/changed-files.txt | sed 's/^/  /'
          fi

          # The matrix and the base images each container is published for come from the config.yaml and container.yaml files, so adding a container or a base image needs no change here
          BUILD_MATRIX=$(.bin/tools build-matrix)
          CONTAINER_BASE_IMAGES=$(.bin/tools container-base-images)

          MATRIX='[]'
          while read -r WORK_DIR BASE_IMAGE; do
            # Pass the config file as it was in the commit we're comparing with, so the tool can tell which base images changed in it
            PREVIOUS_CONFIG=()
            if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}:${WORK_DIR}/config.yaml" 2>/dev/null; then
              git show "${BASE_SHA}:${WORK_DIR}/config.yaml" > ".out/previous/${WORK_DIR}-config.yaml"
              PREVIOUS_CONFIG=(--previous-config ".out/previous/${WORK_DIR}-config.yaml")
            fi

            CONTAINERS=$(.bin/tools analyze-changes \
              --work-dir "./${WORK_DIR}" \
              --default-base-image "${BASE_IMAGE}" \
              --changed-files-file .out/changed-files.txt \
              "${PREVIOUS_CONFIG[@]}" \
              "${REBUILD_ALL_FLAG[@]}" \
                | jq -c '.containers')

            # Drop the containers that aren't built for this base image
            CONTAINERS=$(jq -c \
              --arg baseImage "${BASE_IMAGE}" \
              --argjson only "${CONTAINER_BASE_IMAGES}" \
              'map(select($only[.] // [] | index($baseImage) != null))' \
              <<< "${CONTAINERS}")

            if [ "${CONTAINERS}" = "[]" ]; then
              continue
            fi

            MATRIX=$(jq -c \
              --arg workDir "${WORK_DIR}" \
              --arg baseImage "${BASE_IMAGE}" \
              --argjson containers "${CONTAINERS}" \
              '. + [{workDir: $workDir, baseImage: $baseImage, containers: ($containers | tostring)}]' \
              <<< "${MATRIX}")
          done < <(jq -r '.[] | "\(.workDir) \(.baseImage)"' <<< "${BUILD_MATRIX}")

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          # Add a summary of what is going to be built
          {
            echo "### Containers to build"
            echo ""
            if [ "${MATRIX}" = "[]" ]; then
              echo "Nothing to build: nothing that impacts the container images changed."
            else
              jq -r '.[] | "- **\(.baseImage)**: `\(.containers | fromjson | join("`, `"))`"' <<< "${MATRIX}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:

    name: "Build ${{ matrix.baseImage }}"

    needs: analyze-changes

    # Skip the entire job when there's nothing to build: an empty matrix is an error
    if: needs.analyze-changes.outputs.matrix != '[]'

    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.analyze-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      # Ensure that IMAGE_NAME_BASE is all lowercase
      - name: Lowercase IMAGE_NAME_BASE
        run: |
          echo "IMAGE_NAME_BASE=${IMAGE_NAME_BASE,,}" >> "$GITHUB_ENV"

      # Add support for building for other platforms with QEMU
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: "linux/amd64,linux/arm64"

      # Login against a container registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compile the tools app
      - name: Compile tools app
        run: |
          mkdir -p ../.bin
          go build \
            -v \
            -o ../.bin/tools
        working-directory: ./tools

      # Containers are built in dependency order, using the architectures in their configuration
      - name: Build and push container images
        env:
          CONTAINERS_JSON: ${{ matrix.containers }}
        run: |
          set -euo pipefail

          mkdir -p .out
          mapfile -t CONTAINERS < <(jq -r '.[]' <<< "${CONTAINERS_JSON}")
          if [ "${#CONTAINERS[@]}" -eq 0 ]; then
            echo "The build plan does not contain any container" >&2
            exit 1
          fi

          .bin/tools \
            build \
            "${CONTAINERS[@]}" \
            --default-base-image "${{ matrix.baseImage }}" \
            --work-dir "./${{ matrix.workDir }}" \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
            --result-file .out/build-results.json

      # Build results are collected into the dynamic attestation matrix after every base image finishes
      - name: Upload build results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-results-${{ matrix.baseImage }}
          path: .out/build-results.json
          if-no-files-found: error
          retention-days: 1

  prepare-attestations:

    name: "Prepare attestations"

    needs: build

    if: needs.build.result == 'success'

    runs-on: ubuntu-26.04

    permissions:
      actions: read

    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}

    steps:
      - name: Download build results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-results-*
          path: .out/build-results

      - name: Prepare attestation matrix
        id: prepare
        run: |
          set -euo pipefail

          shopt -s nullglob
          FILES=(.out/build-results/*/build-results.json)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No build result was downloaded" >&2
            exit 1
          fi

          MATRIX=$(jq -sc 'add | map({imageName, digest}) | sort_by(.imageName)' "${FILES[@]}")
          if ! jq -e 'all(.[]; (.imageName | length > 0) and (.digest | startswith("sha256:")))' <<< "${MATRIX}" >/dev/null; then
            echo "A build result does not contain a valid image name and digest" >&2
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  attest:

    name: "Attest ${{ matrix.imageName }}"

    needs: prepare-attestations

    if: needs.prepare-attestations.outputs.matrix != '[]'

    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-attestations.outputs.matrix) }}

    steps:
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.imageName }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
