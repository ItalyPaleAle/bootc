name: "Build Containers"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      rebuild-all:
        description: "Rebuild every container image, without analyzing what changed"
        type: boolean
        default: true

env:
  # Docker registry
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME_BASE: ${{ github.repository }}

jobs:
  # Determines which container images need to be rebuilt, by comparing the current commit with the
  # one built by the previous successful run of this workflow
  analyze-changes:

    name: "Analyze changes"

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      # Necessary for looking up the commit built by the previous run
      actions: read

    outputs:
      # JSON array with one object per base image that has containers to rebuild, containing the
      # "baseImage" and "version" of the image, and "containers" with the JSON-encoded list of
      # containers to build, in the order they must be built in
      matrix: ${{ steps.analyze-changes.outputs.matrix }}

    env:
      # All the base images that are built, and the version of Enterprise Linux they are based on
      BUILD_MATRIX: |-
        [
          {"baseImage": "centos-stream", "version": "9"},
          {"baseImage": "centos-stream", "version": "10"},
          {"baseImage": "alma-linux", "version": "9"},
          {"baseImage": "alma-linux", "version": "10"},
          {"baseImage": "alma-linux-rpi", "version": "10"}
        ]
      # Containers that are only built for some of the base images: the ones that are not listed
      # here are built for every base image they are defined for in the config files
      CONTAINER_BASE_IMAGES: |-
        {
          "zfs": ["centos-stream-9", "centos-stream-10", "alma-linux-9", "alma-linux-10"],
          "monitoring-zfs": ["centos-stream-9", "centos-stream-10", "alma-linux-9", "alma-linux-10"],
          "server": ["alma-linux-9", "alma-linux-10", "alma-linux-rpi-10"],
          "server-zfs": ["alma-linux-9", "alma-linux-10"],
          "server-worker": ["alma-linux-9", "alma-linux-10"],
          "server-k3s": ["alma-linux-9", "alma-linux-10"],
          "server-worker-zfs": ["alma-linux-10"],
          "server-k3s-zfs": ["alma-linux-10"],
          "server-mochi": ["alma-linux-10"],
          "server-atlas": ["alma-linux-10"],
          "server-boba": ["alma-linux-10"]
        }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The entire history is needed to diff against the commit built by the previous run
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      # Compile the tools app
      - name: Compile tools app
        run: |
          mkdir -p ../.bin
          go build \
            -v \
            -o ../.bin/tools
        working-directory: ./tools

      # Find the commit that was built by the previous successful run of this workflow, which is
      # the baseline the current commit is compared with.
      # Using the previous *successful* run, rather than the previous commit, means that changes
      # that were part of a run that failed are analyzed again.
      - name: Find the previously-built commit
        id: previous-run
        env:
          GH_TOKEN: ${{ github.token }}
          # Commit that was at the tip of the branch before this push
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          BASE_SHA=$(gh api \
            -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-containers.yaml/runs" \
            -f "branch=${GITHUB_REF_NAME}" \
            -f "status=success" \
            -f "per_page=20" \
            --jq '[.workflow_runs[] | select(.head_sha != env.GITHUB_SHA) | .head_sha] | first // ""')

          # The commit may no longer be in the history of the branch, for example after a force push
          if [ -n "${BASE_SHA}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Commit ${BASE_SHA} is not in the history of this branch, ignoring it"
            BASE_SHA=""
          fi

          # Fall back to the commit that was at the tip of the branch before this push
          if [ -z "${BASE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${BEFORE_SHA}"
          fi

          echo "Comparing ${GITHUB_SHA} with ${BASE_SHA:-(nothing: all containers will be rebuilt)}"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      # Determine which containers need to be rebuilt for each base image
      - name: Analyze changes
        id: analyze-changes
        env:
          BASE_SHA: ${{ steps.previous-run.outputs.base_sha }}
          REBUILD_ALL: ${{ inputs.rebuild-all }}
        run: |
          set -euo pipefail

          mkdir -p .out/previous

          # When there's no commit to compare with, or when a full rebuild was requested, all
          # containers are rebuilt
          REBUILD_ALL_FLAG=()
          : > .out/changed-files.txt
          if [ "${REBUILD_ALL}" = "true" ] || [ -z "${BASE_SHA}" ]; then
            REBUILD_ALL_FLAG=(--rebuild-all)
          else
            # Use NUL as separator, so file names are never quoted or split
            git diff --name-only -z "${BASE_SHA}" "${GITHUB_SHA}" > .out/changed-files.txt
            echo "Changed files:"
            tr '\0' '\n' < .out/changed-files.txt | sed 's/^/  /'
          fi

          MATRIX='[]'
          while read -r BASE_IMAGE VERSION; do
            # Pass the config file as it was in the commit we're comparing with, so the tool can
            # tell which base images changed in it
            PREVIOUS_CONFIG=()
            if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}:el${VERSION}/config.yaml" 2>/dev/null; then
              git show "${BASE_SHA}:el${VERSION}/config.yaml" > ".out/previous/el${VERSION}-config.yaml"
              PREVIOUS_CONFIG=(--previous-config ".out/previous/el${VERSION}-config.yaml")
            fi

            CONTAINERS=$(.bin/tools analyze-changes \
              --work-dir "./el${VERSION}" \
              --default-base-image "${BASE_IMAGE}-${VERSION}" \
              --changed-files-file .out/changed-files.txt \
              "${PREVIOUS_CONFIG[@]}" \
              "${REBUILD_ALL_FLAG[@]}" \
                | jq -c '.containers')

            # Drop the containers that aren't built for this base image
            CONTAINERS=$(jq -c \
              --arg baseImage "${BASE_IMAGE}-${VERSION}" \
              --argjson only "${CONTAINER_BASE_IMAGES}" \
              'map(select($only[.] == null or ($only[.] | index($baseImage)) != null))' \
              <<< "${CONTAINERS}")

            if [ "${CONTAINERS}" = "[]" ]; then
              continue
            fi

            MATRIX=$(jq -c \
              --arg baseImage "${BASE_IMAGE}" \
              --arg version "${VERSION}" \
              --argjson containers "${CONTAINERS}" \
              '. + [{baseImage: $baseImage, version: $version, containers: ($containers | tostring)}]' \
              <<< "${MATRIX}")
          done < <(jq -r '.[] | "\(.baseImage) \(.version)"' <<< "${BUILD_MATRIX}")

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          # Add a summary of what is going to be built
          {
            echo "### Containers to build"
            echo ""
            if [ "${MATRIX}" = "[]" ]; then
              echo "Nothing to build: nothing that impacts the container images changed."
            else
              jq -r '.[] | "- **\(.baseImage)-\(.version)**: `\(.containers | fromjson | join("`, `"))`"' <<< "${MATRIX}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:

    name: "Build ${{ matrix.baseImage }}-${{ matrix.version }}"

    needs: analyze-changes

    # Skip the entire job when there's nothing to build: an empty matrix is an error
    if: needs.analyze-changes.outputs.matrix != '[]'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      # Necessary for writing attestations
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.analyze-changes.outputs.matrix) }}

    steps:
      # From: https://github.com/containers/podman/discussions/25582
      # Required for HEREDOC support
      - name: Get a newer podman
        run: |
          set -eux
          # Modify Ubuntu sources to include plucky
          sudo sed -i 's/Suites: noble noble-updates noble-backports/Suites: noble noble-updates noble-backports plucky/' /etc/apt/sources.list.d/ubuntu.sources

          # Ensure preferences.d directory exists
          sudo mkdir -p /etc/apt/preferences.d
          sudo chmod 755 /etc/apt/preferences.d

          # Create podman preferences file
          cat << 'EOF' | sudo tee /etc/apt/preferences.d/podman.pref
          Package: podman buildah golang-github-containers-common crun libgpgme11t64 libgpg-error0 golang-github-containers-image catatonit conmon containers-storage
          Pin: release n=plucky
          Pin-Priority: 991

          Package: libsubid4 netavark passt aardvark-dns containernetworking-plugins libslirp0 slirp4netns
          Pin: release n=plucky
          Pin-Priority: 991

          Package: *
          Pin: release n=plucky
          Pin-Priority: 400
          EOF

          # Update and install podman
          sudo apt update
          sudo apt install -y crun podman

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'tools/go.mod'
          cache-dependency-path: 'tools/go.sum'

      # Ensure that IMAGE_NAME_BASE is all lowercase
      - name: Lowercase IMAGE_NAME_BASE
        run: |
          echo "IMAGE_NAME_BASE=${IMAGE_NAME_BASE,,}" >>${GITHUB_ENV}

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: 'v2.5.3'

      # Add support for building for other platforms with QEMU
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: "linux/amd64,linux/arm64"

      # Login against a container registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup environment
      - name: Setup environment
        run: |
          # Create required folders
          mkdir -p .bin .out

      # Compile the tools app
      - name: Compile tools app
        run: |
          go build \
            -v \
            -o ../.bin/tools
        working-directory: ./tools

      # Build and push container image for base
      # For linux/amd64 and linux/arm64 (or arm64 only for RPi)
      - name: "Build and push container image: base"
        id: build-and-push-base
        if: contains(fromJson(matrix.containers), 'base')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            base \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch ${{ matrix.baseImage == 'alma-linux-rpi' && 'arm64' || 'amd64,arm64' }} \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/base.json
          echo "ImageName=$(jq -r '.imageName' .out/base.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/base.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for tailscale
      # For linux/amd64 and linux/arm64 (or arm64 only for RPi)
      - name: "Build and push container image: tailscale"
        id: build-and-push-tailscale
        if: contains(fromJson(matrix.containers), 'tailscale')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            tailscale \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch ${{ matrix.baseImage == 'alma-linux-rpi' && 'arm64' || 'amd64,arm64' }} \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/tailscale.json
          echo "ImageName=$(jq -r '.imageName' .out/tailscale.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/tailscale.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for monitoring
      # For linux/amd64 and linux/arm64 (or arm64 only for RPi)
      - name: "Build and push container image: k3s"
        id: build-and-push-k3s
        if: contains(fromJson(matrix.containers), 'k3s')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            k3s \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch ${{ matrix.baseImage == 'alma-linux-rpi' && 'arm64' || 'amd64,arm64' }} \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/k3s.json
          echo "ImageName=$(jq -r '.imageName' .out/k3s.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/k3s.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for monitoring
      # For linux/amd64 and linux/arm64 (or arm64 only for RPi)
      - name: "Build and push container image: monitoring"
        id: build-and-push-monitoring
        if: contains(fromJson(matrix.containers), 'monitoring')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            monitoring \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch ${{ matrix.baseImage == 'alma-linux-rpi' && 'arm64' || 'amd64,arm64' }} \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/monitoring.json
          echo "ImageName=$(jq -r '.imageName' .out/monitoring.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/monitoring.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for zfs
      # For linux/amd64
      - name: "Build and push container image: zfs"
        id: build-and-push-zfs
        if: contains(fromJson(matrix.containers), 'zfs')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            zfs \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/zfs.json
          echo "ImageName=$(jq -r '.imageName' .out/zfs.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/zfs.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for monitoring-zfs
      # For linux/amd64
      - name: "Build and push container image: monitoring-zfs"
        id: build-and-push-monitoring-zfs
        if: contains(fromJson(matrix.containers), 'monitoring-zfs')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            monitoring-zfs \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/monitoring-zfs.json
          echo "ImageName=$(jq -r '.imageName' .out/monitoring-zfs.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/monitoring-zfs.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server
      # For linux/amd64 and linux/arm64 (or arm64 only for RPi) (Alma Linux only)
      - name: "Build and push container image: server"
        id: build-and-push-server
        if: contains(fromJson(matrix.containers), 'server')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch ${{ matrix.baseImage == 'alma-linux-rpi' && 'arm64' || 'amd64,arm64' }} \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server.json
          echo "ImageName=$(jq -r '.imageName' .out/server.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-zfs
      # For linux/amd64 (Alma Linux only)
      - name: "Build and push container image: server-zfs"
        id: build-and-push-server-zfs
        if: contains(fromJson(matrix.containers), 'server-zfs')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-zfs \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-zfs.json
          echo "ImageName=$(jq -r '.imageName' .out/server-zfs.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-zfs.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-worker
      # For linux/amd64 and linux/arm64 (Alma Linux only)
      - name: "Build and push container image: server-worker"
        id: build-and-push-server-worker
        if: contains(fromJson(matrix.containers), 'server-worker')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-worker \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64,arm64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-worker.json
          echo "ImageName=$(jq -r '.imageName' .out/server-worker.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-worker.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-k3s
      # For linux/amd64 and linux/arm64 (Alma Linux only)
      - name: "Build and push container image: server-k3s"
        id: build-and-push-server-k3s
        if: contains(fromJson(matrix.containers), 'server-k3s')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-k3s \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64,arm64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-k3s.json
          echo "ImageName=$(jq -r '.imageName' .out/server-k3s.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-k3s.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-worker-zfs
      # For linux/amd64 (Alma Linux 10 only)
      - name: "Build and push container image: server-worker-zfs"
        id: build-and-push-server-worker-zfs
        if: contains(fromJson(matrix.containers), 'server-worker-zfs')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-worker-zfs \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-worker-zfs.json
          echo "ImageName=$(jq -r '.imageName' .out/server-worker-zfs.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-worker-zfs.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-k3s-zfs
      # For linux/amd64 (Alma Linux 10 only)
      - name: "Build and push container image: server-k3s-zfs"
        id: build-and-push-server-k3s-zfs
        if: contains(fromJson(matrix.containers), 'server-k3s-zfs')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-k3s-zfs \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-k3s-zfs.json
          echo "ImageName=$(jq -r '.imageName' .out/server-k3s-zfs.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-k3s-zfs.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-mochi
      # For linux/amd64 (Alma Linux 10 only)
      - name: "Build and push container image: server-mochi"
        id: build-and-push-server-mochi
        if: contains(fromJson(matrix.containers), 'server-mochi')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-mochi \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-mochi.json
          echo "ImageName=$(jq -r '.imageName' .out/server-mochi.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-mochi.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-atlas
      # For linux/amd64 (Alma Linux 10 only)
      - name: "Build and push container image: server-atlas"
        id: build-and-push-server-atlas
        if: contains(fromJson(matrix.containers), 'server-atlas')
        run: |
          set -euo pipefail
          .bin/tools \
            build \
            server-atlas \
            --default-base-image "${{ matrix.baseImage }}-${{ matrix.version }}" \
            --work-dir ./el${{ matrix.version }} \
            --arch amd64 \
            --repository "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BASE }}/${{ matrix.baseImage }}-${{ matrix.version }}/" \
            --platform podman \
            --push \
            --tag "$(date +"%Y%m%d")" \
              | tee .out/server-atlas.json
          echo "ImageName=$(jq -r '.imageName' .out/server-atlas.json)" >> "$GITHUB_OUTPUT"
          echo "Digest=$(jq -r '.digest' .out/server-atlas.json)" >> "$GITHUB_OUTPUT"

      # Build and push container image for server-boba
